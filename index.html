<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Documentation · Simon Lund</title>
		<meta name="description" content="Documentation for open-source projects by Simon Lund." />
		<style>
			:root {
				color-scheme: light dark;
				--paper: light-dark(#f5f3ee, #1b1916);
				--ink: light-dark(#24231d, #f2efe7);
				--ink2: light-dark(#5c594e, #bdb6a8);
				--line: light-dark(rgb(36 35 29 / 0.18), rgb(255 248 235 / 0.16));
			}
			body {
				margin: 0;
				background: var(--paper);
				color: var(--ink);
				font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			main {
				max-width: 42.5rem;
				margin: 0 auto;
				padding: 5rem 1.25rem;
			}
			h1 {
				margin: 0;
				font-size: 1.875rem;
				line-height: 2.25rem;
				letter-spacing: -0.035em;
			}
			p {
				margin: 0.75rem 0 0;
				color: var(--ink2);
			}
			ul {
				margin: 2.5rem 0 0;
				padding: 0;
				list-style: none;
			}
			li + li {
				margin-top: 1.25rem;
			}
			a {
				color: inherit;
				text-decoration: underline;
				text-decoration-thickness: 1px;
				text-underline-offset: 0.2em;
				text-decoration-color: var(--line);
			}
			a:hover {
				text-decoration-color: currentColor;
			}
			li a {
				font-weight: 600;
			}
			li p {
				margin-top: 0.125rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Documentation</h1>
			<p>For open-source projects by <a href="https://simon-lund.com">Simon Lund</a>.</p>
			<ul>
				<li>
					<a href="/svelte-draw/">Klementine Draw</a>
					<p>An infinite canvas for Svelte.</p>
				</li>
			</ul>
		</main>
	</body>
</html>
